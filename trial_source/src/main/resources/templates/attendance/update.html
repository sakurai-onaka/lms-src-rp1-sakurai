<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" 
	th:replace="~{/common/layout :: layout(~{::title},~{::body/content()})}">
<head>
<meta charset="UTF-8">
<title>勤怠情報変更｜LMS</title>
</head>
<body>

	<th:block th:if="${session.loginUserDto.role == '0001'}">
		<h2>勤怠管理</h2>
	</th:block>

	<!--櫻井宝生 – Task.27 開始-->
	<th:block  th:each="error:${errors}" th:if="${not #strings.isEmpty(error)}" id="error">
		<ul style="padding-left: 0; list-style: none;">
			<li><span th:text="'*' + '&nbsp' + ${error}" class="help-inline error"></span></li>
		</ul>
	</th:block>
	<!--櫻井宝生 – Task.27 終了-->
	<th:block th:if="${session.loginUserDto.role != '0001'}">
		<h2>勤怠管理 <small>( [[${attendanceForm.userName}]] )</small></h2>
		<th:block th:if="${session.loginUserDto.leaveFlg == '1'}">
			<h2><small>途中退校日：${dispLeaveDate}</small></h2>
		</th:block>
	</th:block>

	<div class="row">
		<div class="bs-component col-sm-12">
			<form th:action="@{/attendance/update}" method="post" onsubmit="return checkUpdate()">
				<div>
				<table class="table table-hover dataTable no-footer">
					<thead style="display: block;">
						<tr>
							<th class="w160 w10">日付</th>
							<th class="w260">コース内容</th>
							<th class="w220">出勤</th>
							<th class="w220">退勤</th>
							<th class="w100">中抜け時間</th>
							<th class="w100">ステータス</th>
							<th class="w200">備考</th>
						</tr>
					</thead>
					<tbody style="display: block; overflow-y:auto;height:270px; scrollbar-color:#c0c0c0 #f1f1f1;">
						<th:block th:each="dailyAttendanceForm, stat : *{attendanceForm.attendanceList}">
							<tr th:data-index="${stat.index}">
								<th:block>
									<input type="hidden" th:name="|attendanceList[${stat.index}].isToday|" th:value="${dailyAttendanceForm.isToday}" />
									<input type="hidden" th:name="|attendanceList[${stat.index}].studentAttendanceId|" th:value="${dailyAttendanceForm.studentAttendanceId}" />
									<input type="hidden" th:name="|attendanceList[${stat.index}].trainingDate|" th:value="${dailyAttendanceForm.trainingDate}" />
									<input type="hidden" th:name="|attendanceList[${stat.index}].dispTrainingDate|" th:value="${dailyAttendanceForm.dispTrainingDate}" />
									<input type="hidden" th:name="|attendanceList[${stat.index}].sectionName|" th:value="${dailyAttendanceForm.sectionName}" />
									<input type="hidden" th:name="|attendanceList[${stat.index}].statusDispName|" th:value="${dailyAttendanceForm.statusDispName}" />
								</th:block>
								<td class="w140">[[${dailyAttendanceForm.dispTrainingDate}]]</td>
								<td class="w140">[[${dailyAttendanceForm.sectionName}]]</td>
								<!--櫻井宝生 Task.28　開始-->
								<td class="w50"><button type="button" th:value="${stat.index}" onclick="setTime(this)" class="btn btn-success default-button">定時</button></td>
								<!--櫻井宝生 Task.28　終了-->
								<!--
								<td class="w70">
									<input type="text" th:name="|attendanceList[${stat.index}].trainingStartTime|"
									th:value="${dailyAttendanceForm.trainingStartTime}" class="form-control" />
								</td>
								<td class="w70">
									<input type="text" th:name="|attendanceList[${stat.index}].trainingEndTime|"
									th:value="${dailyAttendanceForm.trainingEndTime}" class="form-control" />
								</td>
								-->
								<!--櫻井宝生 Task.26　開始-->
								<td class="w70">
									<select th:name="|attendanceList[${stat.index}].trainingStartTimeHour|" th:id="startTimeHour+${stat.index}" class="form-control">
										<option th:each="hourTime : ${attendanceForm.hourTimes}" th:value="${hourTime.key}" th:inlne="text" class="form-control" 
											th:selected="${hourTime.key == dailyAttendanceForm.trainingStartTimeHour}">[[${hourTime.value}]]</option>
									</select>
								</td>
								<td class="w10">:
								</td>
								<td class="w70">
									<select th:name="|attendanceList[${stat.index}].trainingStartTimeMinute|" th:id="startTimeMinute+${stat.index}" class="form-control">
										<option th:each="minuteTime : ${attendanceForm.minuteTimes}" th:value="${minuteTime.key}" th:inlne="text" class="form-control" 
											th:selected="${minuteTime.key == dailyAttendanceForm.trainingStartTimeMinute}">[[${minuteTime.value}]]</option>
									</select>
								</td>
								<td class="w70">
									<select th:name="|attendanceList[${stat.index}].trainingEndTimeHour|" th:id="endTimeHour+${stat.index}" class="form-control">
										<option th:each="hourTime : ${attendanceForm.hourTimes}" th:value="${hourTime.key}" th:inlne="text" class="form-control" 
											th:selected="${hourTime.key == dailyAttendanceForm.trainingEndTimeHour}">[[${hourTime.value}]]</option>
									</select>
								</td>
								<td class="w10">:
								</td>
								<td class="w70">
									<select th:name="|attendanceList[${stat.index}].trainingEndTimeMinute|" th:id="endTimeMinute+${stat.index}" class="form-control">
										<option th:each="minuteTime : ${attendanceForm.minuteTimes}" th:value="${minuteTime.key}" th:inlne="text" class="form-control" 
											th:selected="${minuteTime.key == dailyAttendanceForm.trainingEndTimeMinute}">[[${minuteTime.value}]]</option>
									</select>
								</td>
								<!--櫻井宝生 - Task.26 終了-->
								<td class="w100">
									<select th:name="|attendanceList[${stat.index}].blankTime|" class="form-control">
										<option th:each="blankTime : ${attendanceForm.blankTimes}" th:value="${blankTime.key}" th:inlne="text" class="form-control" 
											th:selected="${blankTime.key == dailyAttendanceForm.blankTime}">[[${blankTime.value}]]</option>
									</select>
								</td>
								<td class="w70">[[${dailyAttendanceForm.statusDispName}]]</td>
								<td class="w150">
									<input type="text" th:name="|attendanceList[${stat.index}].note|" th:value="${dailyAttendanceForm.note}" class="form-control"></input>
								</td>
							</tr>
						</th:block>
					</tbody>
				</table>
				</div>

				<div class="form-group">
					<th:block th:if="${session.loginUserDto.role == '0001'}">
						<a th:href="@{/attendance/detail}" class="btn btn-default">戻る</a>
					</th:block>
					<th:block th:if="${session.loginUserDto.role != '0001'}">
						<input type="submit" value="戻る" name="indexCompany" class="btn btn-default" />
					</th:block>
					<input type="submit" value="更新" name="complete" class="btn btn-info"/>
					<!-- 櫻井宝生 - Task.27 開始-->
					<script>
						function checkUpdate(){
							var res = confirm("更新します。よろしいですか?");
							return res;
						}
					//櫻井宝生 - Task.27 終了
					//櫻井宝生 - Task.28 開始
						function setTime(button){
							var getNum = button.closest('tr').getAttribute('data-index');
							var getTime = document.getElementById("startTimeHour"+getNum);
							getTime.value = 9;
							var getNum = button.closest('tr').getAttribute('data-index');
							var getTime = document.getElementById("startTimeMinute"+getNum);
							getTime.value = 0;
							var getNum = button.closest('tr').getAttribute('data-index');
							var getTime = document.getElementById("endTimeHour"+getNum);
							getTime.value = 18;
							var getNum = button.closest('tr').getAttribute('data-index');
							var getTime = document.getElementById("endTimeMinute"+getNum);
							getTime.value = 0;
						}
					</script>
					<!-- 櫻井宝生 - Task.27 終了-->
				</div>

			</form>
		</div>
	</div>

</body>
</html>
